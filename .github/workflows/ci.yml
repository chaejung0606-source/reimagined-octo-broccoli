# 배포본이 깨진 채로 사용자에게 내려가는 것을 막는다.
# 앱은 이 브랜치에서 git pull 로 업데이트를 받으므로(updater.py), 여기 올라간
# 커밋은 곧바로 담당자 컴퓨터에서 도는 코드가 된다. 푸시마다 검사한다.
name: 검사

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # GUI(PySide6)와 Playwright 브라우저는 넣지 않는다. 테스트는 ERP 화면 없이
      # 이름 짓기·대상 고르기·보관 스캔·재시도 흐름만 시험한다.
      - name: 설치
        run: pip install -e ".[dev]"

      - name: 테스트
        run: python -m pytest -q

      # UI 코드는 PySide6 가 없어 실행할 수 없다. 문법 오류만이라도 걸러 둔다.
      - name: 문법 검사
        run: python -m compileall -q src tools

      # 문법 검사는 없는 이름을 못 잡는다 — 화면 코드는 CI 에서 돌지 않아 단추를 눌러야 터지는 NameError 가
      # 그대로 배포됐다(작업 중 [새로고침] 의 `tid`, 2026-10-14). 없는 이름 · 겹친 정의 · 잘못된 return/break 만 본다.
      - name: 이름 오류 검사
        run: ruff check --select F821,F822,F823,F811,F632,F701,F702,F704,F706,F707,E9 src tools tests

      # 청구서에는 계좌번호·이체자 이름이 들어 있다. .gitignore 를 믿지 않고
      # 실제로 올라간 파일을 확인한다. 한 번 올라가면 이력에서 지우기 어렵다.
      - name: 개인정보 파일 혼입 검사
        run: |
          found=$(git ls-files '*.pdf' '*.hwp' '*.hwpx' '*.jpg' '*.jpeg' '*.xls' '*.xlsx' 'samples/*' '서류/*' '*_받은기록.json' '*_보관목록.json' '*_실행로그.txt' '*_화면구조.txt' '*_화면구조_모음.txt' '*_공유용로그.txt' '*_청구입력기록.json' '*_받지않는결의서.json' '*_주차로그인.json' '*_공무확인증관리대장.json' '*_구글시트연동.json' 'config.json')
          if [ -n "$found" ]; then
            echo "중단: 청구서·기록 파일이 저장소에 올라가 있습니다."
            echo "$found"
            exit 1
          fi
          echo "혼입 없음"
