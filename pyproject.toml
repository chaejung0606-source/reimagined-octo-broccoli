[project]
name = "claim-downloader"
version = "0.2.0"
description = "강원대 ERP 청구서 PDF 자동 다운로드 · 명명 · 비목 분류 데스크톱 앱"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pypdf>=5.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
# 누락 검토(ERP 청구내역 엑셀 대조)에만 쓴다. 없으면 그 단계만 건너뛴다.
excel = ["pandas>=2.0", "xlrd>=2.0", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "openpyxl>=3.1"]   # 장학금 명단 테스트가 가짜 엑셀을 만든다

[project.scripts]
claim-downloader = "claim_downloader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claim_downloader = ["ui/assets/*", "ui/assets/art/*", "ui/assets/icons/*", "ui/assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
