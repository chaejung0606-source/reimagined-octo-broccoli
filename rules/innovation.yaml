# 혁신인재지원금 (소학회 진행요원비) 검토 규칙

version: 1
scope: 혁신인재지원금

required_documents:
  - { key: innovation_application,   label: "[양식8] 혁신인재지원금 신청서" }
  - { key: club_report,      label: "[양식7-1] 월별 활동 결과 보고서" }
  - { key: worklog,     label: "[붙임1] 근로장학생 근무상황부" }
  - { key: id_card_bankbook,         label: "신분증 및 통장 사본", once_only: true }
  - { key: enrollment_cert,     label: "재학증명서" }
  - { key: payment_roster,      label: "지급내역", provided_by: staff }

settings:
  standard_amount: 240000        # 소학회 회장 진행요원비 (샘플 기준)
  hourly_rate: 15000             # 240,000 ÷ 16h — 정액인지 시간급인지 지침 확인 필요
  min_members: null              # TODO: 소학회 최소 인원 미확정
  student_id_pattern: '^\d{9}$'
  report_max_pages: 1            # 서식이 "1페이지로 요약 작성 제출" 명시

rules:
  # ---- 금액 ----
  - id: R-INN-001
    layer: L2
    title: 지원금액이 지급내역과 불일치
    severity: ERROR
    requires: [innovation_application.amount, roster.amount]
    expr: "innovation_application.amount == roster.amount"
    message: "신청서 {innovation_application.amount}원 vs 지급내역 {roster.amount}원."
    fix: "신청서 지원금액을 {roster.amount}원 으로 정정하세요."

  - id: R-INN-002
    layer: L1
    title: 한글 금액 표기 불일치
    severity: ERROR
    requires: [innovation_application.amount, innovation_application.amount_hangul]
    expr: "hangul_amount(innovation_application.amount) == innovation_application.amount_hangul"
    # 예: 240000 → '금이십사만원정'
    message: "숫자 금액({innovation_application.amount})과 한글 표기('{innovation_application.amount_hangul}')가 다릅니다."
    fix: "한글 금액을 '{computed}' 로 정정하세요."

  - id: R-INN-003
    layer: L2
    title: 시간당 단가 이상
    severity: WARN
    requires: [roster.amount, worklog.total_hours]
    expr: "roster.amount / worklog.total_hours == settings.hourly_rate"
    message: "{roster.amount}원 ÷ {worklog.total_hours}시간 = {computed}원/시간 (기준 {settings.hourly_rate}원)."
    fix: "근로시간 또는 지급액을 확인하세요. 정액 지급이라면 이 규칙을 비활성화하세요."

  - id: R-INN-004
    layer: L3
    title: 표준 지급액과 불일치
    severity: WARN
    requires: [roster.amount]
    expr: "roster.amount == settings.standard_amount"
    message: "지급액 {roster.amount}원 이 표준액 {settings.standard_amount}원 과 다릅니다."
    fix: "표준액과 다른 사유를 확인하세요."

  # ---- 소학회 3자 일치 ----
  - id: R-INN-005
    layer: L2
    title: 소학회명 불일치
    severity: ERROR
    check: cross_field_equal
    params: { field: club.name, sources: [innovation_application, club_report, payment_roster] }
    message: "소학회명이 서류마다 다릅니다: {values}"
    fix: "소학회명을 '{expected}' 로 통일하세요."

  - id: R-INN-006
    layer: L2
    title: 신청자가 회장과 불일치
    severity: ERROR
    requires: [innovation_application.applicant, club_report.president, roster.name]
    expr: "all_equal(innovation_application.applicant, club_report.president, roster.name)"
    message: "신청자({innovation_application.applicant}) / 활동보고서 회장({club_report.president}) / 지급대상({roster.name}) 이 서로 다릅니다."
    fix: "진행요원비는 소학회 회장 본인이 신청해야 합니다. 인적사항을 통일하세요."

  - id: R-INN-007
    layer: L2
    title: 지도교수 불일치
    severity: ERROR
    check: cross_field_equal
    params: { field: club.advisor, sources: [innovation_application, club_report] }
    message: "지도교수가 서류마다 다릅니다: {values}"
    fix: "지도교수명을 통일하세요."

  - id: R-INN-008
    layer: L2
    title: 근무상황부 확인자가 지도교수와 불일치
    severity: WARN
    requires: [worklog.approver, club.advisor]
    expr: "normalize(worklog.approver) == normalize(club.advisor)"
    message: "근무상황부 확인자({worklog.approver})가 지도교수({club.advisor})와 다릅니다."
    fix: "지도교수 확인을 받거나, 대리 확인 사유를 명시하세요."

  - id: R-INN-009
    layer: L2
    title: 활동분야 불일치
    severity: ERROR
    requires: [innovation_application.field, club_report.field_checked]
    expr: "innovation_application.field == club_report.field_checked"
    message: "신청서 활동분야('{innovation_application.field}')와 보고서 체크('{club_report.field_checked}')가 다릅니다."
    fix: "보고서의 활동분야 체크를 '{innovation_application.field}' 로 정정하세요."

  - id: R-INN-010
    layer: L2
    title: 활동주제 불일치
    severity: WARN
    requires: [innovation_application.topic, club_report.topic]
    expr: "similarity(innovation_application.topic, club_report.topic) >= 0.8"
    message: "신청서와 보고서의 활동주제 기술이 다릅니다."
    fix: "활동주제를 동일하게 기재하세요."

  # ---- 활동일 ↔ 근로일 ----
  - id: R-INN-011
    layer: L1
    title: 근로일자가 근로기간 밖
    severity: ERROR
    scope: each_row
    requires: ["worklog.rows[].date", "worklog.period"]
    expr: "worklog.period.start <= row.date <= worklog.period.end"
    message: "{row.date} 는 근로기간({worklog.period}) 밖입니다."
    fix: "근로기간을 정정하거나 해당 일자를 제외하세요."

  - id: R-INN-012
    layer: L2
    title: 보고서 활동일과 근무상황부 근로일 불일치
    severity: WARN
    requires: ["club_report.activity_dates", "worklog.rows[].date"]
    expr: "set(club_report.activity_dates) <= set(worklog.rows[].date)"
    message: "보고서에 적힌 활동일 {missing} 이(가) 근무상황부에 없습니다."
    # 샘플: AIMPACT 5월 — 보고서 5/4·5/18 vs 근무상황부 5/6·5/13·5/20
    fix: "활동일과 근로일자를 일치시키거나, 무보수 활동임을 보고서에 명시하세요."

  - id: R-INN-013
    layer: L1
    title: 근로시간 합계 오류
    severity: ERROR
    requires: [worklog.rows, worklog.total_hours]
    expr: "sum(worklog.rows[].hours) == worklog.total_hours"
    message: "행별 합계 {computed}시간 vs 기재된 총 {worklog.total_hours}시간."
    fix: "총 근로시간을 {computed} 으로 정정하세요."

  # ---- 팀원 명단 ----
  - id: R-INN-014
    layer: L1
    title: 팀원 학번 형식 오류
    severity: WARN
    scope: each_member
    requires: ["club_report.members[].student_id"]
    expr: "match(member.student_id, settings.student_id_pattern)"
    message: "{member.name} 의 학번 '{member.student_id}' 이(가) 9자리 형식이 아닙니다."
    # 샘플: 최용빈 20213452 (8자리)
    fix: "학번을 9자리로 정확히 기재하세요."

  - id: R-INN-015
    layer: L1
    title: 팀원 중복 또는 연락처 오류
    severity: WARN
    check: member_list_sanity
    params: { field: club_report.members }
    message: "팀원 명단에 문제가 있습니다: {issues}"
    fix: "중복 인원을 제거하고 연락처 형식(010-0000-0000)을 맞추세요."

  - id: R-INN-016
    layer: L3
    title: 소학회 인원 요건 미달
    severity: WARN
    enabled_if: "settings.min_members != null"
    expr: "len(club_report.members) >= settings.min_members"
    message: "소학회 인원 {computed}명 — 최소 {settings.min_members}명 미달."
    fix: "인원 요건을 확인하세요."

  # ---- 보고서 형식 ----
  - id: R-INN-017
    layer: L1
    title: 활동보고서 분량 초과
    severity: WARN
    requires: [club_report.page_count]
    expr: "club_report.page_count <= settings.report_max_pages"
    message: "활동보고서가 {club_report.page_count}페이지입니다 (지침: {settings.report_max_pages}페이지 요약)."
    fix: "1페이지로 요약하여 다시 작성하세요."

  - id: R-INN-018
    layer: L1
    title: 성과표 실적 미기재
    severity: WARN
    check: outcome_table_filled
    params: { field: club_report.outcomes }
    message: "성과표의 '이번 달 실적'/'누적 달성 값'이 전부 공란 또는 0입니다."
    fix: "실제 실적을 기재하거나, 실적이 없다면 사유를 향후 계획란에 명시하세요."

  - id: R-INN-019
    layer: L1
    title: 증빙서류 체크와 실제 첨부 불일치
    severity: ERROR
    check: checkbox_matches_attachments
    params: { field: innovation_application.attachments_checked }
    message: "신청서에 체크된 증빙서류 중 실제로 첨부되지 않은 것이 있습니다: {missing}"
    fix: "{missing} 을(를) 첨부하거나 체크를 해제하세요."

  - id: R-INN-020
    layer: L1
    title: 오탈자·날짜 표기 오류
    severity: WARN
    check: text_anomaly
    params: { fields: [club_report.highlights] }
    # 샘플: '5원 4일' (→ '5월 4일')
    message: "본문에 오탈자로 보이는 표기가 있습니다: {found}"
    fix: "해당 표기를 확인하고 수정하세요."
